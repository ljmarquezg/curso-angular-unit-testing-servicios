<section class="container">
  <h1>Products Component</h1>
  <button
    data-testid="btn-promise"
    class="call-promise"
    (click)="callPromise()"
  >Call promise</button>
  <p class="promise-response" data-testid="promise-response">{{rta}}</p>
  <div class="my-grid">
    @for (product of products(); track product.id) {
      <app-product [product]="product"></app-product>
    }
  </div>
  <button
    data-testid="btn-load-products"
    class="load-products"
    (click)="getAllProducts()"
    [disabled]="status === 'loading'"
  >
    @if(status === 'init' || status === 'success') {
      <span>Load More</span>
    }
    @if(status === 'loading') {
     Loading...
    }
    @if(status === 'error') {
      <span>Try Again</span>
    }
  </button>
</section>
